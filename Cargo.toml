[package]
name = "rando"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
paste = "1.0.15"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["serde_derive"] }
tokio = { version = "1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
] }
tower-layer = { version = "0.3.3", default-features = false }
tower-service = { version = "0.3.3", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = [
  "attributes",
] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "registry",
] }
treetrace = "0.1.1"
